<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result View</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 800px;
            margin: 30px auto;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #008000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            color: #008000;
        }
        .info {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .result-section {
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #ddd;
            padding: 15px;
            background: #fafafa;
            border-radius: 5px;
        }
        .result-section h3 {
            margin-top: 0;
            color: #444;
            font-size: 16px;
        }
        .result-section img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 10px;
        }
        .btn-container {
            text-align: center;
            margin-top: 20px;
        }
        .btn {
            background-color: #008000;
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
        .btn-back {
            background-color: #0066cc;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .not-found {
            color: red;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Examination Result Publication</h2>
    </div>

    {% if student %}
        <div class="info">
            Exam: {{ student.exam }} | Board: {{ student.board }} | Year: {{ student.year }} | Roll: {{ roll }}
        </div>

        <!-- dynamic loop: specific images for each student/roll -->
        {% for doc in student.documents %}
            <div class="result-section">
                <h3>{{ doc.title }}</h3>
                <img src="{{ url_for('static', filename=doc.file) }}" alt="{{ doc.title }}">
            </div>
        {% endfor %}

    {% else %}
        <div class="not-found">
            <p>No result found for Roll: {{ roll }}</p>
        </div>
    {% endif %}

    <div class="btn-container">
        <button class="btn" onclick="window.print()">Download / Print PDF</button>
        <a href="/" class="btn btn-back">Search Again</a>
    </div>
</div>

</body>
</html>
